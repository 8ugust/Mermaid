<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Flowchart Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="mermaid.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 왼쪽 사이드바 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>노드 검색</h2>
            </div>
            <div class="search-section">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="nodeSearch" 
                        placeholder="노드 이름을 입력하세요..."
                        autocomplete="off"
                    >
                    <button id="searchBtn" class="search-button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>

        <!-- 오른쪽 메인 콘텐츠 -->
        <div class="main-content">
            <!-- 플로팅 줌 컨트롤 -->
            <div class="zoom-controls">
                <div class="zoom-info">
                    <span id="zoomPercentage">100%</span>
                </div>
                <button class="zoom-reset-btn" id="zoomResetBtn" title="전체보기로 초기화">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                        <path d="M21 3v5h-5"></path>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                        <path d="M3 21v-5h5"></path>
                    </svg>
                </button>
            </div>
            <div class="canvas-container" id="canvasContainer">
                <div class="mermaid-wrapper" id="mermaidWrapper">
                    <div class="mermaid-grid" id="mermaidGrid">
                        <!-- 플로우차트가 동적으로 생성됩니다 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
